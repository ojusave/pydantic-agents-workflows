[project]
name = "logfire-pydantic"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web Framework
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.1",
    "typing-extensions>=4.12.2",
    # AI & LLM
    "pydantic-ai-slim[openai,anthropic]>=2.55.0",
    "pydantic-ai-harness[render]",
    "openai>=2.2.0",
    "anthropic>=0.69.0",
    "genai-prices>=0.0.67",
    # Observability
    "logfire[asyncpg,fastapi,httpx,system-metrics]>=4.12.0",
    # Database
    "pgvector>=0.2.5,<0.3.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "render>=1.2.0,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black==24.10.0",
    "ruff==0.7.4",
]

# The Render capability is merged but not released on PyPI yet. All three
# related packages use the same upstream commit to keep their versions aligned.
[tool.uv.sources]
pydantic-ai-harness = { git = "https://github.com/pydantic/pydantic-ai.git", rev = "cc3172717752395b7475e545338950235533ccb8", subdirectory = "src/pydantic_ai_harness" }
pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai.git", rev = "cc3172717752395b7475e545338950235533ccb8", subdirectory = "pydantic_ai_slim" }
pydantic-graph = { git = "https://github.com/pydantic/pydantic-ai.git", rev = "cc3172717752395b7475e545338950235533ccb8", subdirectory = "pydantic_graph" }
